<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Voting App - Live</title>
<style>
body{font-family:Arial;background:#eef2f7;padding:20px}
.card{max-width:500px;margin:auto;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ccc;box-sizing:border-box}
button{background:#27ae60;color:white;border:none;font-size:16px;cursor:pointer}
button:hover{background:#219150}
.candidate{border:2px solid #eee;padding:12px;margin:8px 0;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}
.candidate.selected{border-color:#27ae60;background:#eafaf1}
.result-bar{background:#eee;height:20px;border-radius:10px;margin:5px 0}
.result-fill{background:#27ae60;height:20px;border-radius:10px}
</style></head><body>
<div class="card" id="voteSection">
<h2>🗳️ Smart Online Voting</h2>
<input type="text" id="voterId" placeholder="Enter Voter ID (e.g. VOT123)">
<div id="candidates"></div>
<button onclick="castVote()">Cast My Vote</button>
<p id="msg"></p>
<hr>
<button onclick="showResults()" style="background:#2c3e50">View Live Results (Admin)</button>
</div>

<div class="card" id="resultSection" style="display:none">
<h2>📊 Live Results</h2>
<div id="resultData"></div>
<button onclick="backToVote()" style="background:#95a5a6">Back to Vote</button>
<button onclick="clearVotes()" style="background:#e74c3c">Reset All Votes</button>
</div>

<script>
const candidates = ["Candidate A - Rahul", "Candidate B - Priya", "Candidate C - Aman", "NOTA"];
let votes = JSON.parse(localStorage.getItem('votes') || '{"Candidate A - Rahul":0,"Candidate B - Priya":0,"Candidate C - Aman":0,"NOTA":0}');
let votedIds = JSON.parse(localStorage.getItem('votedIds') || '[]');
let selected = null;

function loadCandidates(){
 let html="";
 candidates.forEach(c=>{
  html+=`<div class="candidate" onclick="selectCandidate(this,'${c}')"><span>${c}</span><span>○</span></div>`;
 });
 document.getElementById('candidates').innerHTML=html;
}
function selectCandidate(el,name){
 document.querySelectorAll('.candidate').forEach(d=>{d.classList.remove('selected'); d.querySelector('span:last-child').innerText='○'});
 el.classList.add('selected'); el.querySelector('span:last-child').innerText='●'; selected=name;
}
function castVote(){
 const id=document.getElementById('voterId').value.trim();
 if(!id){document.getElementById('msg').innerText='❌ Enter Voter ID'; return;}
 if(votedIds.includes(id)){document.getElementById('msg').innerText='❌ This ID already voted!'; return;}
 if(!selected){document.getElementById('msg').innerText='❌ Select a candidate'; return;}
 votes[selected]++; votedIds.push(id);
 localStorage.setItem('votes',JSON.stringify(votes)); localStorage.setItem('votedIds',JSON.stringify(votedIds));
 document.getElementById('msg').innerText='✅ Vote Cast Successfully! Thank you.'; document.getElementById('voterId').value='';
}
function showResults(){
 document.getElementById('voteSection').style.display='none'; document.getElementById('resultSection').style.display='block';
 let total=Object.values(votes).reduce((a,b)=>a+b,0); let html=`<p>Total Votes: ${total}</p>`;
 for(let c in votes){ let per=total?Math.round(votes[c]*100/total):0;
  html+=`<p>${c} - ${votes[c]} votes (${per}%)<div class="result-bar"><div class="result-fill" style="width:${per}%"></div></div></p>`;}
 document.getElementById('resultData').innerHTML=html;
}
function backToVote(){document.getElementById('resultSection').style.display='none'; document.getElementById('voteSection').style.display='block';}
function clearVotes(){if(confirm('Reset all votes?')){localStorage.clear(); votes={"Candidate A - Rahul":0,"Candidate B - Priya":0,"Candidate C - Aman":0,"NOTA":0}; votedIds=[]; showResults();}}
loadCandidates();
</script>
</body></html>
